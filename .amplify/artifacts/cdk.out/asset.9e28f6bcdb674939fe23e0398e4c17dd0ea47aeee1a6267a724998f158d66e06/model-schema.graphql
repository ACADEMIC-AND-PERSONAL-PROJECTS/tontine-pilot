type Group @model @auth(rules: [{allow: private, operations: [read]},
  {allow: owner, operations: [create, update, delete], ownerField: "owner"}])
{
  name: String!
  description: String
  descriptionEn: String
  currency: String @default(value: "FCFA")
  contributionAmount: Int!
  frequency: GroupFrequency
  memberCount: Int!
  currentCycleIndex: Int!
  emergencyFundBalance: Int!
  emergencyFundTarget: Int!
  role: GroupRole
  cycleCollected: Int
  cycleExpected: Int
  openAlerts: Int
  archived: Boolean @default(value: "false")
}

type Member @model @auth(rules: [{allow: private, operations: [read]},
  {allow: owner, operations: [create, update, delete], ownerField: "owner"}])
{
  groupId: ID! @index(queryField: "listMemberByGroupId")
  name: String!
  email: String!
  phone: String
  trustScore: Int!
  lateCount: Int @default(value: "0")
  cyclesCompleted: Int @default(value: "0")
  notifySms: Boolean @default(value: "false")
}

type Cycle @model @auth(rules: [{allow: private, operations: [read]},
  {allow: owner, operations: [create, update, delete], ownerField: "owner"}])
{
  groupId: ID! @index(queryField: "listCycleByGroupId")
  cycleNumber: Int!
  recipientMemberId: ID
  recipientName: String
  startDate: AWSDate!
  endDate: AWSDate!
  status: CycleStatus
  totalExpected: Int!
  totalCollected: Int!
}

type Contribution @model @auth(rules: [{allow: private, operations: [read]},
  {allow: owner, operations: [create, update, delete], ownerField: "owner"}])
{
  groupId: ID! @index(queryField: "listContributionByGroupId")
  cycleId: ID! @index(queryField: "listContributionByCycleId")
  memberId: ID!
  memberName: String!
  amount: Int!
  status: ContributionStatus
  dateDeclared: AWSDate
  rawText: String
  rawTextEn: String
  method: ContributionMethod
  transactionId: String
  receiptKey: String
}

type Alert @model @auth(rules: [{allow: private, operations: [read]},
  {allow: owner, operations: [create, update, delete], ownerField: "owner"}])
{
  groupId: ID! @index(queryField: "listAlertByGroupId")
  cycleId: ID
  memberId: ID
  memberName: String
  type: AlertType
  message: String!
  messageEn: String
  createdAt: AWSDateTime!
  resolved: Boolean @default(value: "false")
  proposalKind: AlertProposalKind
  proposalDetails: String
  proposalDetailsEn: String
  dedupeKey: String! @index(queryField: "listAlertByDedupeKey")
}

type FundMovement @model @auth(rules: [{allow: private, operations: [read]},
  {allow: owner, operations: [create, update, delete], ownerField: "owner"}])
{
  groupId: ID! @index(queryField: "listFundMovementByGroupId")
  cycleId: ID
  kind: FundMovementKind
  amount: Int!
  reason: String
  reasonEn: String
  createdAt: AWSDateTime!
}

type Digest @model @auth(rules: [{allow: private, operations: [read]},
  {allow: owner, operations: [create, update, delete], ownerField: "owner"}])
{
  groupId: ID! @index(queryField: "listDigestByGroupId")
  cycleId: ID!
  locale: DigestLocale
  script: String!
  audioKey: String!
  createdAt: AWSDateTime!
}

enum GroupFrequency {
  WEEKLY
  MONTHLY
}

enum GroupRole {
  Admin
  Member
}

enum CycleStatus {
  OPEN
  CLOSED
}

enum ContributionStatus {
  CONFIRMED
  PENDING
  LATE
  COVERED_BY_EMERGENCY_FUND
}

enum ContributionMethod {
  TEXT_NLU
  OCR_RECEIPT
  MANUAL
  EMERGENCY_FUND
}

enum AlertType {
  LATE_PAYMENT
  ANOMALY
  REMINDER
  SWAP_PROPOSAL
  EMERGENCY_DISPATCH
}

enum AlertProposalKind {
  swap
  installment
  emergency
}

enum FundMovementKind {
  DEBIT
  REPAY
}

enum DigestLocale {
  fr
  en
}