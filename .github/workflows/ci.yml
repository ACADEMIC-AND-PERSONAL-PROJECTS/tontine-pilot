name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        # npm ci is broken on this tree (stale nested entries confuse arborist
        # across npm 11.x minors); plain install is proven green. Revisit post-hackathon.
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit + integration tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Secret scan (gitleaks v8 — v9 action needs a paid license key)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /tmp
          /tmp/gitleaks detect --source . --no-git --config .gitleaks.toml -v
