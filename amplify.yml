version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version && npm --version
        - npm install -g npm@11
        - npm install --no-audit --no-fund
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
